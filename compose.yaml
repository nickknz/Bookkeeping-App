services:
  db:
    image: postgres:16-alpine
    container_name: bookkeeping-db
    environment:
      POSTGRES_DB: bookkeeping
      POSTGRES_USER: bookkeeping
      POSTGRES_PASSWORD: bookkeeping
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./bookkeeping-api/src/main/resources/db/V1__init_schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookkeeping -d bookkeeping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./bookkeeping-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
