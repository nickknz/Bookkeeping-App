spring.application.name=bookkeeping-api
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.flyway.locations=classpath:db

mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-handlers-package=com.knzheng.bookkeeping.common.config
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
