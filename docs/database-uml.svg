<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title description">
  <title id="title">Bookkeeping 完整数据库 UML</title>
  <desc id="description">Users、Category、Transactions 和 Budget 四张表及其关系。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#756126"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4a421f" flood-opacity="0.12"/>
    </filter>
    <style>
      .box { fill: #fffef9; stroke: #d8d3c2; stroke-width: 2; filter: url(#shadow); }
      .header { fill: #ffc928; }
      .table-name { fill: #2c2c29; font: 700 22px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .physical-name { fill: #725800; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .field { fill: #52524d; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #9a6800; font-weight: 700; }
      .relation { fill: none; stroke: #756126; stroke-width: 2.4; marker-end: url(#arrow); }
      .label { fill: #665f4f; font: 600 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .cardinality { fill: #8d6a00; font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .note-box { fill: #fff8dc; stroke: #ead68d; stroke-width: 1.5; }
      .note-title { fill: #684e00; font: 700 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #5f594a; font: 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend { fill: #777066; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#f8f8f5"/>

  <!-- Relationships -->
  <path class="relation" d="M 590 235 L 450 235"/>
  <text class="label" x="492" y="220">属于用户</text>
  <text class="cardinality" x="548" y="257">0..N</text>
  <text class="cardinality" x="462" y="257">1</text>

  <path class="relation" d="M 1030 235 L 1160 235"/>
  <text class="label" x="1062" y="220">使用分类</text>
  <text class="cardinality" x="1042" y="257">0..N</text>
  <text class="cardinality" x="1137" y="257">1</text>

  <path class="relation" d="M 255 560 L 255 430"/>
  <text class="label" x="272" y="505">属于用户</text>
  <text class="cardinality" x="268" y="548">0..N</text>
  <text class="cardinality" x="268" y="453">1</text>

  <!-- User -->
  <g>
    <rect class="box" x="60" y="70" width="390" height="360" rx="18"/>
    <path class="header" d="M 78 70 H 432 Q 450 70 450 88 V 130 H 60 V 88 Q 60 70 78 70 Z"/>
    <text class="table-name" x="84" y="105">User</text>
    <text class="physical-name" x="370" y="104" text-anchor="end">users</text>
    <text class="field key" x="84" y="162">PK  id              UUID</text>
    <text class="field key" x="84" y="194">UQ  email           VARCHAR(255)</text>
    <text class="field" x="84" y="226">    password_hash   VARCHAR(255)</text>
    <text class="field" x="84" y="258">    nickname        VARCHAR(50)?</text>
    <text class="field" x="84" y="290">    avatar_url      VARCHAR(500)?</text>
    <text class="field" x="84" y="322">    currency        VARCHAR(3)</text>
    <text class="field" x="84" y="354">    created_at      TIMESTAMP</text>
    <text class="field" x="84" y="386">    updated_at      TIMESTAMP</text>
  </g>

  <!-- Transaction -->
  <g>
    <rect class="box" x="590" y="45" width="440" height="420" rx="18"/>
    <path class="header" d="M 608 45 H 1012 Q 1030 45 1030 63 V 105 H 590 V 63 Q 590 45 608 45 Z"/>
    <text class="table-name" x="614" y="80">Transaction</text>
    <text class="physical-name" x="950" y="79" text-anchor="end">transactions</text>
    <text class="field key" x="614" y="137">PK  id              UUID</text>
    <text class="field key" x="614" y="169">FK  user_id         UUID</text>
    <text class="field key" x="614" y="201">FK  category_id     INTEGER</text>
    <text class="field" x="614" y="233">    amount          DECIMAL(12,2)</text>
    <text class="field" x="614" y="265">    type            VARCHAR(10)</text>
    <text class="field" x="614" y="297">    note            VARCHAR(500)?</text>
    <text class="field" x="614" y="329">    date            DATE</text>
    <text class="field" x="614" y="361">    created_at      TIMESTAMP</text>
    <text class="field" x="614" y="393">    updated_at      TIMESTAMP</text>
    <text class="legend" x="614" y="435">CHECK amount &gt; 0 · type IN (income, expense)</text>
  </g>

  <!-- Category -->
  <g>
    <rect class="box" x="1160" y="70" width="380" height="350" rx="18"/>
    <path class="header" d="M 1178 70 H 1522 Q 1540 70 1540 88 V 130 H 1160 V 88 Q 1160 70 1178 70 Z"/>
    <text class="table-name" x="1184" y="105">Category</text>
    <text class="physical-name" x="1460" y="104" text-anchor="end">category</text>
    <text class="field key" x="1184" y="162">PK  id           INTEGER</text>
    <text class="field key" x="1184" y="194">UQ  code         VARCHAR(50)</text>
    <text class="field" x="1184" y="226">    name         VARCHAR(50)</text>
    <text class="field" x="1184" y="258">    icon         VARCHAR(50)?</text>
    <text class="field" x="1184" y="290">    type         VARCHAR(10)</text>
    <text class="field" x="1184" y="322">    is_default   BOOLEAN</text>
    <text class="field" x="1184" y="354">    sort_order   INTEGER</text>
    <text class="legend" x="1184" y="392">V2 初始化 22 个全局预设分类</text>
  </g>

  <!-- Budget -->
  <g>
    <rect class="box" x="60" y="560" width="390" height="280" rx="18"/>
    <path class="header" d="M 78 560 H 432 Q 450 560 450 578 V 620 H 60 V 578 Q 60 560 78 560 Z"/>
    <text class="table-name" x="84" y="595">Budget</text>
    <text class="physical-name" x="370" y="594" text-anchor="end">budget</text>
    <text class="field key" x="84" y="652">PK  id              UUID</text>
    <text class="field key" x="84" y="684">FK  user_id         UUID</text>
    <text class="field" x="84" y="716">    month           DATE</text>
    <text class="field" x="84" y="748">    limit_amount    DECIMAL(12,2)</text>
    <text class="field" x="84" y="780">    created_at      TIMESTAMP</text>
    <text class="field" x="84" y="812">    updated_at      TIMESTAMP</text>
  </g>

  <!-- Design notes -->
  <g>
    <rect class="note-box" x="590" y="560" width="950" height="280" rx="18"/>
    <text class="note-title" x="620" y="600">当前模型的关键规则</text>
    <text class="note" x="620" y="638">• Category 是全局共享的一级系统分类，不属于任何 User，也没有父子层级。</text>
    <text class="note" x="620" y="674">• Transaction 必须同时关联一个 User 和一个 Category。</text>
    <text class="note" x="620" y="710">• Budget 只表示月度总预算，与 Category 没有直接关系。</text>
    <text class="note" x="620" y="746">• Budget 使用 UNIQUE (user_id, month)，每个用户每月最多一条。</text>
    <text class="note" x="620" y="782">• 未来支持自定义分类时，再为 Category 增加可空的 owner_user_id。</text>
    <text class="legend" x="620" y="815">PK = Primary Key · FK = Foreign Key · UQ = Unique · ? = Nullable</text>
  </g>
</svg>
